openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /animals:
    get:
      operationId: getAnimals
      summary: List user-provided animal profiles
      responses:
        "200":
          description: Animals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Animal" }
  /fight:
    post:
      operationId: createFight
      summary: Score a v1 matchup and narrate eligible outcomes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FightInput" }
      responses:
        "200":
          description: Validated result and narration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FightResponse" }
        "400":
          description: Invalid selections or scoring inputs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiFailure" }
        "429":
          description: Per-IP fight request limit reached before scoring
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiFailure" }
        "502":
          description: Invalid engine output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getBuildHealth
      tags: [health]
      summary: Health and build identity
      responses:
        "200":
          description: Current running build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildHealth"
components:
  schemas:
    Animal:
      type: object
      additionalProperties: false
      required: [name, profile, mass_kg, length_m, top_speed_kmh, primary_weapon, bite_force_n, armor, temperament, fighting_style, environments, field_sources]
      properties:
        name: { type: string, minLength: 1 }
        profile: { type: string, enum: [adult_male, adult_female] }
        mass_kg: { type: number, minimum: 0 }
        length_m: { type: number, minimum: 0 }
        top_speed_kmh: { type: number, minimum: 0 }
        primary_weapon: { type: string, enum: [bite, claws, horns, tusks, strike, constriction] }
        bite_force_n: { type: [number, "null"], minimum: 0 }
        armor: { type: string, enum: [none, thick_hide, shell, scales] }
        temperament: { type: string, enum: [avoids, defensive, aggressive] }
        fighting_style: { type: string, enum: [ambush, sustained, bluff, grapple, charge] }
        environments:
          $ref: "#/components/schemas/EnvironmentLevels"
        field_sources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FieldSource"
    EnvironmentLevel:
      type: string
      enum: [full, hampered, cannot]
    EnvironmentLevels:
      type: object
      additionalProperties: false
      required: [land, shallow_water, deep_water]
      properties:
        land: { $ref: "#/components/schemas/EnvironmentLevel" }
        shallow_water: { $ref: "#/components/schemas/EnvironmentLevel" }
        deep_water: { $ref: "#/components/schemas/EnvironmentLevel" }
    FieldSource:
      type: object
      additionalProperties: false
      required: [tier, citation]
      properties:
        tier: { type: [integer, "null"], enum: [1, 2, 3, null] }
        citation: { type: string, description: Public source attribution and URL when known. Internal review notes are never returned. }
    FightInput:
      type: object
      required: [animalA, animalB]
      additionalProperties: false
      properties:
        animalA: { type: string, minLength: 1 }
        animalB: { type: string, minLength: 1 }
        environment: { type: string, enum: [land, shallow_water, deep_water], default: land }
        mode: { type: string, enum: [realistic, forced_fight], default: realistic }
        encounter: { type: string, enum: [face_off], default: face_off }
    FavoredOutcome:
      type: object
      additionalProperties: false
      required: [kind, animal]
      properties:
        kind: { type: string, enum: [favored] }
        animal: { type: string, minLength: 1, description: Exact selected animal name }
    EvenOutcome:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [even] }
    IndeterminateOutcome:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [indeterminate] }
    NoContestOutcome:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [no_contest] }
    NoEngagementOutcome:
      type: object
      additionalProperties: false
      required: [kind, animals]
      properties:
        kind: { type: string, enum: [no_engagement] }
        animals:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, minLength: 1 }
    Outcome:
      oneOf:
        - { $ref: "#/components/schemas/FavoredOutcome" }
        - { $ref: "#/components/schemas/EvenOutcome" }
        - { $ref: "#/components/schemas/IndeterminateOutcome" }
        - { $ref: "#/components/schemas/NoContestOutcome" }
        - { $ref: "#/components/schemas/NoEngagementOutcome" }
    Factor:
      type: object
      additionalProperties: false
      required: [name, value, reason]
      properties:
        name: { type: string, minLength: 1 }
        value: { type: number }
        reason: { type: string, minLength: 1 }
    MatchupResult:
      type: object
      additionalProperties: false
      required: [outcome, deciding_factor, evidence_quality, encounter_label, advantage_score, factors]
      properties:
        outcome: { $ref: "#/components/schemas/Outcome" }
        deciding_factor: { type: [string, "null"], enum: [fighting_ability, environmental_advantage, behavior, null] }
        evidence_quality: { type: string, enum: [mostly_higher_tier, mixed, mostly_lower_tier_or_unknown] }
        encounter_label: { type: string, enum: [hypothetical, ranges_overlap, documented] }
        advantage_score: { type: [number, "null"] }
        factors:
          type: array
          items: { $ref: "#/components/schemas/Factor" }
    Beat:
      type: object
      required: [text, action, animal, facts_used]
      properties:
        text: { type: string, minLength: 1 }
        action: { type: string, enum: [approach, charge, bite, dodge, grapple, retreat, finish] }
        animal:
          type: [string, "null"]
          minLength: 1
          description: Selected animal name; null only for the final even-matchup finish beat.
        facts_used:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, minLength: 1 }
    FightResponse:
      type: object
      additionalProperties: false
      required: [result, beats, explanation, narration_status, narration_reason, narration_source]
      description: A valid verdict is returned even when narration is unavailable. Available narration has 5–8 beats. Unavailable narration has no beats and a reason code. Non-narrated gates have no beats and a one-line explanation.
      properties:
        result: { $ref: "#/components/schemas/MatchupResult" }
        beats:
          type: array
          minItems: 0
          maxItems: 8
          items: { $ref: "#/components/schemas/Beat" }
        explanation: { type: [string, "null"], minLength: 1 }
        narration_status: { type: string, enum: [available, unavailable, not_required] }
        narration_source:
          type: [string, "null"]
          enum: [cache, model, null]
          description: Origin of available narration; null when unavailable or not required.
        narration_reason:
          type: [string, "null"]
          enum: [INVALID_NARRATION, LLM_PROVIDER_FAILURE, NARRATION_DAILY_CAP_REACHED, LLM_NOT_CONFIGURED, LLM_CONFIGURATION, NARRATION_CAP_CONFIGURATION, NARRATION_FAILED, null]
    ApiFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BuildHealth:
      type: object
      additionalProperties: false
      required: [status, build_id]
      properties:
        status: { type: string, enum: [ok] }
        build_id: { type: string, minLength: 1 }

